# SceneLog 데이터 계층 (로컬 개발 + EC2 배포 공용)
#
# 메모리 상한을 처음부터 명시한다 — EC2 t3.micro(RAM 1GB) 배포를 전제로
# 로컬에서도 같은 제약으로 돌려, 배포일(8/5)에 OOM을 처음 만나는 일을 피한다.
# 애플리케이션 컨테이너(app)는 배포일에 Dockerfile과 함께 추가한다.
# 로컬 개발 중 앱은 IDE/gradlew로 실행한다 (연결 대상: localhost).

services:
  postgres:
    image: postgres:16-alpine
    container_name: scenelog-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenelog}
      POSTGRES_DB: ${POSTGRES_DB:-scenelog}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenelog}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: scenelog-mongo
    # WiredTiger 캐시를 0.25GB로 제한 — 기본값은 호스트 RAM에 비례해 커진다 (§8-A)
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scenelog-redis
    # 캐시 용도이므로 상한 도달 시 LRU 축출이 올바른 동작이다
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  mongo_data:
