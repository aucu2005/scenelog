# SceneLog 전체 스택 (로컬 개발 + EC2 배포 공용)
#
# 메모리 상한을 처음부터 명시한다 — EC2 t3.micro(RAM 1GB) 배포를 전제로
# 로컬에서도 같은 제약으로 돌려, 배포일에 OOM을 처음 만나는 일을 피한다.
#
# app은 profile로 분리 — 로컬 개발 흐름을 깨지 않는다:
#   docker compose up -d                     → DB 3개만 (로컬 개발: 앱은 IDE/gradlew)
#   docker compose --profile app up -d --build → 앱 포함 4개 (EC2 배포)

services:
  app:
    build: .
    container_name: scenelog-app
    profiles: ["app"]
    environment:
      # 컨테이너 안에서 localhost는 자기 자신 — 반드시 서비스명으로 (3호 교훈: 조용히 틀리는 설정 금지)
      POSTGRES_HOST: postgres
      MONGO_HOST: mongo
      REDIS_HOST: redis
      POSTGRES_USER: ${POSTGRES_USER:-scenelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenelog}
      POSTGRES_DB: ${POSTGRES_DB:-scenelog}
      TMDB_API_KEY: ${TMDB_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    ports:
      - "8080:8080"
    mem_limit: 640m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  postgres:
    image: postgres:16-alpine
    container_name: scenelog-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenelog}
      POSTGRES_DB: ${POSTGRES_DB:-scenelog}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenelog}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: scenelog-mongo
    # WiredTiger 캐시를 0.25GB로 제한 — 기본값은 호스트 RAM에 비례해 커진다 (§8-A)
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scenelog-redis
    # 캐시 용도이므로 상한 도달 시 LRU 축출이 올바른 동작이다
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  mongo_data:
